name: Build NISA TUNNELING

on:
  workflow_dispatch:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Rebrand ke NISA TUNNELING
        run: bash nisa/rebrand.sh

      - name: Aktifkan enkripsi config (MMKV + Android Keystore)
        run: bash nisa/encrypt-storage.sh

      - name: Menu Hubungi Admin + wallpaper
        run: bash nisa/branding.sh

      - name: Enkripsi ekspor/impor config
        env:
          NISA_SEED: ${{ secrets.NISA_CONFIG_KEY || secrets.APP_KEYSTORE_PASSWORD }}
        run: bash nisa/encrypt-config.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --channel=0 --install "ndk;30.0.16248370"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
          sed -i '10i\        \n            ndkVersion = "30.0.16248370"' V2rayNG/app/build.gradle.kts

      - name: Cache libhevtun
        id: hev
        uses: actions/cache@v4
        with:
          path: libs
          key: libhevtun-${{ runner.os }}-${{ hashFiles('compile-hevtun.sh') }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}

      - name: Build libhevtun
        if: steps.hev.outputs.cache-hit != 'true'
        run: bash compile-hevtun.sh

      - name: Copy libhevtun
        run: cp -r libs V2rayNG/app/

      - name: Ambil libv2ray.aar (versi sesuai submodule)
        run: |
          TAG=$(git -C AndroidLibXrayLite describe --tags --abbrev=0)
          mkdir -p V2rayNG/app/libs
          curl -fL "https://github.com/2dust/AndroidLibXrayLite/releases/download/${TAG}/libv2ray.aar" \
            -o V2rayNG/app/libs/libv2ray.aar

      - name: Siapkan keystore
        env:
          KS_B64: ${{ secrets.APP_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/nisa.jks" || {
              echo "::error::Secret APP_KEYSTORE_BASE64 tidak valid. Salin ulang HANYA baris panjang base64 dari CARA_PAKAI.txt (tanpa teks lain)."
              exit 1
            }
            keytool -list -keystore "$RUNNER_TEMP/nisa.jks" -storepass "$KS_PASS" >/dev/null 2>&1 || {
              echo "::error::Keystore terbaca, tapi APP_KEYSTORE_PASSWORD salah atau isi keystore rusak."
              exit 1
            }
            echo "SIGN_PASS=$KS_PASS"   >> $GITHUB_ENV
            echo "SIGN_ALIAS=$KS_ALIAS" >> $GITHUB_ENV
          else
            echo "::warning::Secret keystore kosong, pakai keystore sementara (update antar-build tidak bisa menimpa install lama)"
            keytool -genkeypair -keystore "$RUNNER_TEMP/nisa.jks" -alias nisa -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass nisatunnel -keypass nisatunnel -dname "CN=NISA TUNNELING"
            echo "SIGN_PASS=nisatunnel" >> $GITHUB_ENV
            echo "SIGN_ALIAS=nisa"      >> $GITHUB_ENV
          fi

      - name: Build APK
        working-directory: V2rayNG
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod +x gradlew
          ./gradlew assemblePlaystoreRelease \
            -PABI_FILTERS='arm64-v8a;armeabi-v7a' \
            -Pandroid.injected.signing.store.file=$RUNNER_TEMP/nisa.jks \
            -Pandroid.injected.signing.store.password=$SIGN_PASS \
            -Pandroid.injected.signing.key.alias=$SIGN_ALIAS \
            -Pandroid.injected.signing.key.password=$SIGN_PASS

      - uses: actions/upload-artifact@v4
        with:
          name: NISA-TUNNELING-apk
          path: V2rayNG/app/build/outputs/apk/playstore/release/*.apk
