name: Generate Keystore (jalankan sekali saja)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Buat keystore acak
        run: |
          PASS=$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-20)
          keytool -genkeypair \
            -keystore nisa-release.jks \
            -alias nisa \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=NISA TUNNELING, OU=NISA VPN, O=NISA VPN, L=Tangerang, ST=Banten, C=ID"

          base64 -w0 nisa-release.jks > nisa-release.jks.b64

          {
            echo "=== SALIN 3 NILAI INI KE Settings > Secrets and variables > Actions ==="
            echo ""
            echo "Nama secret: APP_KEYSTORE_BASE64"
            echo "Isi (baris di bawah ini, satu baris panjang):"
            cat nisa-release.jks.b64
            echo ""
            echo "Nama secret: APP_KEYSTORE_PASSWORD"
            echo "Isi: $PASS"
            echo ""
            echo "Nama secret: APP_KEYSTORE_ALIAS"
            echo "Isi: nisa"
            echo ""
            echo "PENTING:"
            echo "- Setelah disalin ke Secrets, hapus artifact run ini (tombol tempat sampah di halaman run)."
            echo "- Simpan juga file nisa-release.jks di tempat aman (USB/Drive pribadi) sebagai cadangan offline."
            echo "- Jangan jalankan workflow ini lagi kalau sudah ada keystore, nanti APK lama tidak bisa di-update."
          } > CARA_PAKAI.txt

      - uses: actions/upload-artifact@v4
        with:
          name: nisa-keystore-SEKALI-PAKAI
          path: |
            nisa-release.jks
            CARA_PAKAI.txt
